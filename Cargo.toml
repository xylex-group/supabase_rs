[package]
name = "supabase_rs"
version = "0.8.0"
edition = "2021"
rust-version = "1.85"
authors = ["Floris floris@xylex.ai"]
description = "Async Rust client for Supabase PostgREST"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/xylex-group/supabase_rs"
repository = "https://github.com/xylex-group/supabase_rs"
documentation = "https://docs.rs/supabase_rs"
# tests should not be included in the published package
exclude = ["src/tests/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.13.1", default-features = false, features = ["gzip", "json"] }
rand = "0.10.0"
serde_json = "1.0.111"
serde = { version = "1.0.196", features = ["derive"] }
thiserror = "2.0.12"
anyhow = { version = "1.0.86", optional = true }
regex = { version = "1.10.5", optional = true }
cruet = { version = "1.0.0", optional = true }
tokio-postgres = { version = "0.7.13", optional = true }
tokio = { version = "1.37.0", default-features = false, features = ["rt"], optional = true }

[dev-dependencies]
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread", "fs", "time"] }
dotenv = "0.15.0"
tokio-postgres = "0.7.13"

[features]
default = ["native_tls"]
nightly = ["graphql"]
graphql = ["dep:anyhow", "dep:regex"]
storage = ["dep:tokio", "tokio/fs"]
rpc = []
typegen = ["dep:cruet", "dep:tokio-postgres", "dep:tokio"]
rustls = ["reqwest/rustls"]
native_tls = ["reqwest/native-tls"]

[lints.rust]
unsafe_code = "deny"
deprecated = "warn"
elided_lifetimes_in_paths = "warn"
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"                         # `unsafe_op_in_unsafe_fn` may become the default in future Rust versions: https://github.com/rust-lang/rust/issues/71668
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

[lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"

[lints.clippy]
all = "warn"
correctness = "warn"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
# pedantic = "warn" # Maybe Enable later
# nursery = "warn" # Maybe Enable later

# Additional lints from https://rust-lang.github.io/rust-clippy/master/index.html?groups=restriction
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
create_dir = "warn"
clone_on_ref_ptr = "warn"
# expect_used = "warn" # Enable later
missing_assert_message = "warn"
panic_in_result_fn = "warn"
str_to_string = "warn"
todo = "warn"
unwrap_used = "warn"
unimplemented = "warn"
wildcard_enum_match_arm = "warn"
